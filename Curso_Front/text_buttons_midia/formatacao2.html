<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <style>
        fieldset{
            border-radius: 20px;
        }
        .box{
            margin: 5px;
        }
        label{
            width:100px;
            text-align: right;
            display: inline-block;
            padding-right: 5px;
            padding: 5px;            
        }
    </style>
</head>
    <body>
        <div class ="central_box">
            <form action="#" method="get">
                <h1 style="text-align: center;" >Formulário de Cadastro</h1>
                <div class="box">
                    <fieldset>
                        <legend style="text-align: left;">Dados Pessoais</legend>
                        <label>Nome: </label> <input type="text">
                        <label>Email: </label><input type="email"><br>
                        <label>Profissão:  </label> <input type="text">
                        <label>Empresa: </label><input type="text"><br>
                    </fieldset>
                </div>
                <div class="box">
                    <fieldset>
                        <legend>Localização</legend>
                        <label>Endereço: </label><input type="text">
                        <label>Número: </label><input type="number"><br>
                        <label>Bairro: </label><input type="text"><br>
                        <label>Cidade/UF: </label><input type="text"><br>
                    </fieldset>
                </div>
                <div class="box">
                    <fieldset>
                        <legend>Contato</legend>    
                        <label>Celular: </label><input type="number">
                        <label>WhattsApp: </label><input type="number"><br>
                        <label>Linkedin: </label><input type="url">
                        <label>GitHub: </label><input type="url"><br>
                    </fieldset>
                </div>
                <button type="submit">Enviar</button> <button type="reset">Limpar</button>
            </form>
        </div>
    </body>
</html>
