<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzas do Med</title>
</head>
<body>
    <form method="get">
        
    <h2>Qual adicionais voce deseja?</h2><br>

    <input type="checkbox"name="opcional[]"><label>+ QUEIJO</label><br>
    <input type="checkbox"name="opcional[]"><label>+ CALABRESA</label><br>
    <input type="checkbox"name="opcional[]"><label>+ CEBOLA</label><br>
    <input type="checkbox"name="opcional[]"><label>+ AZEITONA</label><br>
    <input type="checkbox"name="opcional[]"><label>+CATUPIRY</label><br>

    <h2>Borda recheada?</h2><br>

    <input type="radio" name = "borda" value = sim><label>Sim</label><br>
    <input type="radio" name = "borda" value = nao><label>Não</label><br>
    
    <h2>Bebidas</h2>

    <input type="radio" name = "bebida" value="agua"> Água
    <input type="radio" name = "bebida" value="suco"> Suco
    <input type="radio" name = "bebida" value = refrigerante> Refrigerante
    <input type="radio" name = "bebida" value = cha> Chá <br>

    <button type="submit">Registrar Pedido</button>
    
    </form>
</body>
</html>
