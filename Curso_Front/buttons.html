<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
</head>
<body>
    <form method="get">
        <label>Nome: </label><input type="text" name="name" required><br>
        <label>Idade: </label><input type="number" name="age" required><br>
        <label>Senha: </label><input type="password" name="password" required><br>

        <button type="button">Clicavel</button>
        <button type="button" onclick="alert('Clicou botão')">Clicavel</button><br>
        <button type="button" onmouseover="alert('Passei aqui')">Passe o mouse</button><br>
        <button type="reset">CLique para resetar</button>
        <button type="submit" >Enviar</button>
        
    </form>
</body>
</html>
