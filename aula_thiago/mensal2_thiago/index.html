<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header>
        <section class="img-logo">
                <img src="/img-logo.png" alt="Logo Cruzeiro do Sul">
        </section>
    </header>

    <main>
        <section class="area-login">
            
            <section class="mensagem">
                <span class="bemvindo">Sejam Bem-Vindos!</span>
                <span class="portal">Portal do Aluno.</span>
            </section>
            
                <section class="dados-usuario">
                    <div class="txt-entrar">
                        <h3>Entrar</h3>
                        <p>Preencha os dados para acessar</p>
                    </div>
            
                    <label id="rgm" for="rgm">rgm:</label> <input type="text" inputmode="numeric" pattern="[0-9]*">
                    <label id="senha" for="senha">senha:</label> <input type="password">
                    <button type="submit">Acessar</button>
                </section>
        </section>
    </main>
</body>
</html>
